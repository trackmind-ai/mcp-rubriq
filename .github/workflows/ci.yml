name: CI

# Deliberately `pull_request`, never `pull_request_target` — a forked PR must never get
# access to a repo secret. Nothing in this workflow needs one today (public GitHub-hosted
# runners + no API keys), so a fork PR runs identically to an in-repo PR.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -r plugins/mcp-rubriq/skills/mcp-rubriq/introspection/requirements.txt
      - run: python -m pytest -q

  integration-matrix:
    name: Integration matrix
    # Spawns real npx/uvx-launched servers over real sockets — slow and network-dependent,
    # so ubuntu-only rather than fanned across the full OS/Python grid (see R5.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -r plugins/mcp-rubriq/skills/mcp-rubriq/introspection/requirements.txt
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run integration matrix
        # 3 env-gated cases (GitHub/Brave/Slack) and 1 Chromium-download case are
        # skip-marked by default in tests/test_matrix.json — this is the routine-CI run,
        # not --include-skipped.
        run: python tests/run_test_matrix.py

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # pyright resolves imports against what is actually installed. Without the runtime
      # requirements it reports reportMissingImports for mcp/pydantic/anyio/httpx/uvicorn
      # and fails, even though nothing is wrong with the code. Keep this in step with the
      # same install line in the `test` job.
      - run: python -m pip install -r plugins/mcp-rubriq/skills/mcp-rubriq/introspection/requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pyright

  validate:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .

  dco-check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every commit in this PR has a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by:'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer (run: git commit -s, see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit "$missing"
